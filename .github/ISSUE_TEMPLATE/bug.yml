name: Bug
description: Something is broken or behaves unexpectedly
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, URL, which account. Never paste secrets or passwords.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log lines, error messages, screenshots, command output.
      render: shell

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and how badly. Is production down or degraded?
