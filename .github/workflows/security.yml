name: Security

# What a pull request must not bring (a secret, a vulnerable production dependency), and a weekly look at what became
# vulnerable since (#207). It does not use the change detection of ci.yml: the checks are quick.
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole history, not only the change: a secret committed and deleted is still in it.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --no-banner --verbose

  # Fails on a high or critical advisory in what runs in production. The moderate and low ones are listed in docs/security.md.
  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm audit --omit=dev --audit-level=high
