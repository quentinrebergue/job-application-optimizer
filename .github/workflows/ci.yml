name: CI

on:
  pull_request:
    branches: [master]

jobs:
  # Decides which of the jobs below have anything to check. A job skipped
  # through `if:` counts as passed, so this also works with required checks.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      renderer: ${{ steps.filter.outputs.renderer }}
      migrator: ${{ steps.filter.outputs.migrator }}
      gateway: ${{ steps.filter.outputs.gateway }}
      hasher: ${{ steps.filter.outputs.hasher }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$files"

          matches() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          # Anything outside these folders and Markdown files is the app itself.
          outside() { printf '%s\n' "$files" | grep -Evq "$1" && echo true || echo false; }

          ci=$(matches '^\.github/workflows/ci\.yml$')
          cd=$(matches '^\.github/workflows/cd\.yml$')
          app=$(outside '^(services|k8s|docs|terraform|ansible|scripts|load)/|\.md$|^\.github/(workflows/cd\.yml|ISSUE_TEMPLATE/)')
          renderer=$(matches '^services/resume-renderer/')
          migrator=$(matches '^services/db-migrator/')
          # The tests of the app run its SQL against the real migrations (#221): a new migration
          # must be tried against them, even when nothing else of the app changed.
          migrations=$(matches '^services/db-migrator/migrations/')
          gateway=$(matches '^services/ai-gateway/')
          hasher=$(matches '^services/password-hasher/')

          # If the CI itself changed, check everything.
          if [ "$ci" = true ]; then app=true; renderer=true; migrator=true; gateway=true; hasher=true; fi
          if [ "$migrations" = true ]; then app=true; fi

          # Images to build (not pushed): the ones whose files changed, and all
          # of them when the CD changes, since it builds them.
          items=""
          add() { items="${items:+$items,}$1"; }
          { [ "$app" = true ] || [ "$cd" = true ]; } && add '{"image":"job-application-optimizer","context":"."}'
          { [ "$renderer" = true ] || [ "$cd" = true ]; } && add '{"image":"resume-renderer","context":"services/resume-renderer"}'
          { [ "$migrator" = true ] || [ "$cd" = true ]; } && add '{"image":"db-migrator","context":"services/db-migrator"}'
          { [ "$gateway" = true ] || [ "$cd" = true ]; } && add '{"image":"ai-gateway","context":"services/ai-gateway"}'
          { [ "$hasher" = true ] || [ "$cd" = true ]; } && add '{"image":"password-hasher","context":"services/password-hasher"}'
          echo "Images to build: [$items]"

          {
            echo "app=$app"
            echo "renderer=$renderer"
            echo "migrator=$migrator"
            echo "images=[$items]"
            echo "gateway=$gateway"
            echo "hasher=$hasher"
          } >> "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    # A real Postgres next to the job (#221): the *.db.test.ts files run the SQL of the quotas, the rate
    # limits and the data layer against it, with the real migrations, in a schema of their own. A fake
    # pool cannot show a wrong query, a lock that does not hold or a column that was renamed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Set here, and the global setup refuses to run in CI without it: the tests cannot be skipped by mistake.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      # Route types (PageProps…) are generated by Next.js; tsc needs them.
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - run: npm test

  # Builds the images the CD would build, without pushing them: catches what
  # tests do not (a broken Dockerfile, a missing folder, `next build` errors,
  # a new base image or a new version of a build action).
  docker-build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          # Reuse the layers the CD cached on master; do not write the cache from PRs.
          cache-from: type=gha,scope=${{ matrix.image }}

  resume-renderer:
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/resume-renderer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/resume-renderer/go.mod
          cache-dependency-path: services/resume-renderer/go.sum

      # Same pinned release and checksum as the Dockerfile, so the rendering
      # tests exercise the Typst version that ships in the image.
      - name: Install Typst
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race -count=1 ./...
  db-migrator:
    needs: changes
    if: needs.changes.outputs.migrator == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/db-migrator
    # A real Postgres next to the job: the tests exercise transactions, locks
    # and rollbacks, which a fake cannot reproduce.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/db-migrator/go.mod
          cache-dependency-path: services/db-migrator/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      # Every migration must apply cleanly on an empty database, and a second
      # run must be a no-op. This catches a broken migration before it merges.
      - name: Apply the real migrations twice
        run: |
          go run .
          go run . | grep '"applied":0'

      - run: go test -race -count=1 ./...

  ai-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/ai-gateway/go.mod
          # No dependency yet, so no go.sum to cache.
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race -count=1 ./...

  password-hasher:
    needs: changes
    if: needs.changes.outputs.hasher == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/password-hasher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/password-hasher/go.mod
          cache-dependency-path: services/password-hasher/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race -count=1 ./...
