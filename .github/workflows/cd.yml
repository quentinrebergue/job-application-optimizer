name: CD

on:
  push:
    branches: [master]
    paths-ignore:
      - 'k8s/**'
      - '**.md'

permissions:
  contents: read

# Two merges in a row must not build and push at the same time.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  # Decides which images need rebuilding, as a JSON list for the build matrix.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Without a usable base commit (first push, force push) build everything.
          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base commit, building everything"
            files="__all__"
          else
            files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          fi
          echo "Changed files:"
          printf '%s\n' "$files"

          items=""
          add() { items="${items:+$items,}$1"; }
          matches() { printf '%s\n' "$files" | grep -Eq "$1"; }
          # Anything outside these folders, Markdown files and .github is the app image.
          outside() { printf '%s\n' "$files" | grep -Evq "$1"; }

          if [ "$files" = "__all__" ]; then
            add '{"image":"job-application-optimizer","context":"."}'
            add '{"image":"resume-renderer","context":"services/resume-renderer"}'
            add '{"image":"db-migrator","context":"services/db-migrator"}'
          else
            if [ -n "$files" ] && outside '^(services|k8s|docs|terraform|ansible|scripts)/|\.md$|^\.github/'; then
              add '{"image":"job-application-optimizer","context":"."}'
            fi
            if matches '^services/resume-renderer/'; then
              add '{"image":"resume-renderer","context":"services/resume-renderer"}'
            fi
            if matches '^services/db-migrator/'; then
              add '{"image":"db-migrator","context":"services/db-migrator"}'
            fi
          fi

          echo "images=[$items]" >> "$GITHUB_OUTPUT"
          echo "Images to build: [$items]"
  build:
    needs: changes
    # An empty matrix is an error, so skip the job when there is nothing to build.
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/quentinrebergue/${{ matrix.image }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Point the manifests at the new images
        env:
          IMAGES: ${{ needs.changes.outputs.images }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          args=()
          for image in $(echo "$IMAGES" | jq -r '.[].image'); do
            args+=("ghcr.io/quentinrebergue/${image}=ghcr.io/quentinrebergue/${image}:${TAG}")
          done
          cd k8s
          kustomize edit set image "${args[@]}"

      - name: Commit the new tags
        run: |
          set -euo pipefail
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "Deploy ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
