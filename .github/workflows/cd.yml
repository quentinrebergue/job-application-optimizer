name: CD

on:
  push:
    branches: [master]
    paths-ignore:
      - 'k8s/**'
      - '**.md'
  # Manual run from the Actions tab: rebuilds and deploys every image.
  workflow_dispatch:

permissions:
  contents: read

# Runs go one after the other. GitHub keeps one running and one pending run:
# a newer merge replaces the pending one, which is safe because each run
# rebuilds whatever changed since the last deploy (see "changes"), not only
# what its own push changed.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  # Decides which images need rebuilding, as a JSON list for the build matrix.
  # An image is rebuilt when its files changed since the commit of the tag it
  # has in k8s/kustomization.yaml, i.e. since its last successful deploy. A run
  # that failed or was cancelled is therefore caught up by the next one.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          items=""
          add() { items="${items:+$items,}$1"; }

          # The deployed tags are read from the latest master (a run that ended
          # after this push may have written new ones).
          deployed_tag() {
            git show origin/master:k8s/kustomization.yaml \
              | yq ".images[] | select(.name == \"ghcr.io/quentinrebergue/$1\") | .newTag"
          }

          # Files changed between the deployed tag of an image and this commit.
          # __all__: no known commit to compare with (first deploy, rewritten history) or manual run.
          # __newer__: a commit newer than this one is already deployed: never go back.
          changed_since_deploy() {
            local tag
            tag="$(deployed_tag "$1")"
            if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$tag" ] || ! git cat-file -e "$tag^{commit}" 2>/dev/null; then
              echo "__all__"
            elif ! git merge-base --is-ancestor "$tag" "$GITHUB_SHA"; then
              echo "__newer__"
            else
              git diff --name-only "$tag" "$GITHUB_SHA"
            fi
          }

          check() { # image, context, pattern of its files ("app" = everything outside the other folders)
            local files
            files="$(changed_since_deploy "$1")"
            if [ "$files" = "__newer__" ]; then
              echo "$1: a newer commit is already deployed, skipped"
            elif [ "$files" = "__all__" ]; then
              echo "$1: rebuild (no deployed commit to compare with, or manual run)"
              add "{\"image\":\"$1\",\"context\":\"$2\"}"
            elif [ "$3" = "app" ] && printf '%s\n' "$files" | grep -Evq '^(services|k8s|docs|terraform|ansible|scripts)/|\.md$|^\.github/|^$'; then
              echo "$1: rebuild, changed since its deploy:"; printf '%s\n' "$files" | sed 's/^/  /'
              add "{\"image\":\"$1\",\"context\":\"$2\"}"
            elif [ "$3" != "app" ] && printf '%s\n' "$files" | grep -Eq "$3"; then
              echo "$1: rebuild, changed since its deploy:"; printf '%s\n' "$files" | grep -E "$3" | sed 's/^/  /'
              add "{\"image\":\"$1\",\"context\":\"$2\"}"
            else
              echo "$1: up to date"
            fi
          }

          check job-application-optimizer . app
          check resume-renderer services/resume-renderer '^services/resume-renderer/'
          check db-migrator services/db-migrator '^services/db-migrator/'
          check ai-gateway services/ai-gateway '^services/ai-gateway/'
          check password-hasher services/password-hasher '^services/password-hasher/'

          echo "images=[$items]" >> "$GITHUB_OUTPUT"
          echo "Images to build: [$items]"

  build:
    needs: changes
    # An empty matrix is an error, so skip the job when there is nothing to build.
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/quentinrebergue/${{ matrix.image }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The latest master, not the commit that started this run: another run may
      # have written its own tags in the meantime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Point the manifests at the new images and push
        env:
          IMAGES: ${{ needs.changes.outputs.images }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Set only the tags of the images this run built, on top of the
          # latest master. If master moves before the push, start again from it
          # (the edit is re-applied, so there is nothing to merge).
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            args=()
            for image in $(echo "$IMAGES" | jq -r '.[].image'); do
              current="$(yq ".images[] | select(.name == \"ghcr.io/quentinrebergue/${image}\") | .newTag" k8s/kustomization.yaml)"
              # Never replace a tag with an older commit.
              if [ -n "$current" ] && git cat-file -e "$current^{commit}" 2>/dev/null \
                && ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
                echo "${image}: ${current} is newer than ${TAG}, kept"
                continue
              fi
              args+=("ghcr.io/quentinrebergue/${image}=ghcr.io/quentinrebergue/${image}:${TAG}")
            done
            if [ "${#args[@]}" -eq 0 ]; then
              echo "Nothing to update"
              exit 0
            fi
            (cd k8s && kustomize edit set image "${args[@]}")
            if git diff --quiet; then
              echo "Tags already up to date"
              exit 0
            fi
            git add k8s/kustomization.yaml
            git commit -m "Deploy ${TAG} [skip ci]"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "master moved during the deploy, retrying ($attempt/3)"
            sleep $((attempt * 5))
          done
          echo "Could not push the new tags after 3 attempts" >&2
          exit 1
