name: CD

on:
  push:
    branches: [master]
    paths-ignore:
      - 'k8s/**'
      - '**.md'

permissions:
  contents: read

# Two merges in a row must not build and push at the same time.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: job-application-optimizer
            context: .
          - image: resume-renderer
            context: services/resume-renderer
          - image: db-migrator
            context: services/db-migrator
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/quentinrebergue/${{ matrix.image }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Point the manifests at the new images
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          cd k8s
          kustomize edit set image \
            "ghcr.io/quentinrebergue/job-application-optimizer=ghcr.io/quentinrebergue/job-application-optimizer:${TAG}" \
            "ghcr.io/quentinrebergue/resume-renderer=ghcr.io/quentinrebergue/resume-renderer:${TAG}" \
            "ghcr.io/quentinrebergue/db-migrator=ghcr.io/quentinrebergue/db-migrator:${TAG}"

      - name: Commit the new tags
        run: |
          set -euo pipefail
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "Deploy ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
