# Dependabot keeps the pinned versions up to date (#143): one PR per update,
# tested by CI like any other change. Minor and patch updates are grouped per
# ecosystem to keep the number of PRs low; major versions come one by one.
version: 2
updates:
  # Base images of the Dockerfiles (pinned by version and digest)
  - package-ecosystem: docker
    directories:
      - /
      - /services/db-migrator
      - /services/resume-renderer
    schedule:
      interval: weekly
    ignore:
      # Node moves to a new major on purpose, with @types/node, when the next
      # LTS is ready and tested; not through an automatic PR.
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  # Actions of the workflows (pinned by commit SHA)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The app's npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types of the Node runtime: their major must match the Node of the image (22).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Majors not supported yet by their tooling (2026-10): typescript-eslint has
      # no TypeScript 7 support, eslint-config-next breaks on ESLint 10. Remove
      # these lines once they catch up.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Go modules of the services
  - package-ecosystem: gomod
    directories:
      - /services/db-migrator
      - /services/resume-renderer
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
