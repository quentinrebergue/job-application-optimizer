- name: Configure app server
  hosts: app_servers
  become: true

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/debian"
        suites: "{{ ansible_distribution_release }}"
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add debian user to docker group
      ansible.builtin.user:
        name: debian
        groups: docker
        append: true

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: /home/debian/.ssh
        state: directory
        owner: debian
        group: debian
        mode: "0700"

    - name: Deploy the GitHub deploy key (private)
      ansible.builtin.copy:
        src: ~/.ssh/ovh_deploy_key
        dest: /home/debian/.ssh/ovh_deploy_key
        owner: debian
        group: debian
        mode: "0600"

    - name: Add GitHub to known_hosts
      ansible.builtin.known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com') }}"
        path: /home/debian/.ssh/known_hosts

    - name: Clone or update the app repo
      become: false
      ansible.builtin.git:
        repo: git@github.com:quentinrebergue/job-application-optimizer.git
        dest: /home/debian/app
        key_file: /home/debian/.ssh/ovh_deploy_key
        accept_hostkey: true
        version: master
        force: true

    - name: Deploy .env.local with secrets
      become: false
      ansible.builtin.template:
        src: templates/env.local.j2
        dest: /home/debian/app/.env.local
        owner: debian
        group: debian
        mode: "0600"

    - name: Deploy .env for Docker Compose interpolation
      become: false
      ansible.builtin.template:
        src: templates/env.j2
        dest: /home/debian/app/.env
        owner: debian
        group: debian
        mode: "0600"

    - name: Install Node.js and npm (for one-off DB migration scripts)
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present

    - name: Install npm dependencies on the host (needed to run db/migrate-*.mjs)
      become: false
      ansible.builtin.command:
        cmd: npm install
        chdir: /home/debian/app

    - name: Start the Postgres container
      become: false
      community.docker.docker_compose_v2:
        project_src: /home/debian/app
        services: [db]
        state: present

    - name: Wait for Postgres to accept connections
      become: false
      ansible.builtin.command:
        cmd: docker compose exec -T db pg_isready -U app -d job_optimizer
        chdir: /home/debian/app
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 10
      delay: 2
      changed_when: false

    - name: Apply SQL migrations
      become: false
      ansible.builtin.shell:
        cmd: docker compose exec -T db psql -U app -d job_optimizer < {{ item }}
        chdir: /home/debian/app
      loop:
        - services/db-migrator/migrations/001_create_jobs.sql
        - services/db-migrator/migrations/002_create_entities.sql
        - services/db-migrator/migrations/003_create_taxonomy.sql
        - services/db-migrator/migrations/004_create_general_questions.sql
        - services/db-migrator/migrations/005_create_knowledge.sql
        - services/db-migrator/migrations/006_create_exercises.sql
        - services/db-migrator/migrations/007_create_cover_letter.sql
      changed_when: true

    - name: Run one-off data migration scripts
      become: false
      ansible.builtin.command:
        cmd: node --env-file=.env.local {{ item }}
        chdir: /home/debian/app
      loop:
        - db/migrate-jobs.mjs
        - db/migrate-entities.mjs
        - db/migrate-taxonomy.mjs
        - db/migrate-questions.mjs
        - db/migrate-knowledge-exercises.mjs
        - db/migrate-cover-letter.mjs
      changed_when: true

    - name: Start the app with Docker Compose
      become: false
      community.docker.docker_compose_v2:
        project_src: /home/debian/app
        build: always
        state: present

    - name: Deploy the backup script
      become: false
      ansible.builtin.template:
        src: templates/backup-db.sh.j2
        dest: /home/debian/backup-db.sh
        owner: debian
        group: debian
        mode: "0700"

    - name: Install cron
      ansible.builtin.apt:
        name: cron
        state: present

    - name: Schedule daily Postgres backup via cron
      become: false
      ansible.builtin.cron:
        name: "job_optimizer postgres backup"
        user: debian
        minute: "0"
        hour: "3"
        job: "/home/debian/backup-db.sh >> /home/debian/backup-db.log 2>&1"
