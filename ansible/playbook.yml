- name: Configure app server
  hosts: app_servers
  become: true

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/debian"
        suites: "{{ ansible_distribution_release }}"
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add debian user to docker group
      ansible.builtin.user:
        name: debian
        groups: docker
        append: true

    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: /home/debian/.ssh
        state: directory
        owner: debian
        group: debian
        mode: "0700"

    - name: Deploy the GitHub deploy key (private)
      ansible.builtin.copy:
        src: ~/.ssh/ovh_deploy_key
        dest: /home/debian/.ssh/ovh_deploy_key
        owner: debian
        group: debian
        mode: "0600"

    - name: Add GitHub to known_hosts
      ansible.builtin.known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com') }}"
        path: /home/debian/.ssh/known_hosts

    - name: Clone or update the app repo
      become: false
      ansible.builtin.git:
        repo: git@github.com:quentinrebergue/job-application-optimizer.git
        dest: /home/debian/app
        key_file: /home/debian/.ssh/ovh_deploy_key
        accept_hostkey: true
        version: master

    - name: Deploy .env.local with secrets
      become: false
      ansible.builtin.template:
        src: templates/env.local.j2
        dest: /home/debian/app/.env.local
        owner: debian
        group: debian
        mode: "0600"
    - name: Start the app with Docker Compose
      become: false
      community.docker.docker_compose_v2:
        project_src: /home/debian/app
        build: always
        state: present
