- name: Sync Kubernetes secrets from vault
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - group_vars/app_servers/vault.yml

  tasks:
    - name: Create/update app-secrets in job-optimizer namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/../terraform/kubeconfig.yaml"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: app-secrets
            namespace: job-optimizer
          type: Opaque
          stringData:
            ANTHROPIC_API_KEY: "{{ vault_anthropic_api_key }}"
            GEMINI_API_KEY: "{{ vault_gemini_api_key }}"
            POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
