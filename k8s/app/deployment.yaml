apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: job-optimizer
spec:
  replicas: 1
  # Old ReplicaSets kept for a rollback (the default is 10, a long list in Argo CD).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: job-optimizer
  template:
    metadata:
      labels:
        app: job-optimizer
    spec:
      priorityClassName: workload-critical
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          # The tag is set by k8s/kustomization.yaml (CD writes it): this one does not exist on purpose.
          image: ghcr.io/quentinrebergue/job-application-optimizer:set-by-kustomize
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://app:$(POSTGRES_PASSWORD)@postgres:5432/job_optimizer"
            - name: RESUME_RENDERER_URL
              value: "http://resume-renderer"
            # Passwords are hashed by this service, not on the thread that serves the pages (#254). Remove the line
            # to hash in the app again: it also does so by itself when the service does not answer.
            - name: PASSWORD_HASHER_URL
              value: "http://password-hasher"
            # How many logins and sign-ups may wait for the service (#258). It does about 3.2 hashes a second, so a
            # queue of 30 is about 10 seconds at the longest: past it a visitor is told "very busy, try again" at once
            # instead of waiting for a page that fails at 60 s (the default, 150, was 47 s). Queue = the longest wait
            # accepted x the rate of the service; with N replicas of the app, divide by N (each has its own queue).
            # The service's own queue (8) never fills before it: the app sends it two at a time.
            - name: BCRYPT_QUEUE
              value: "30"
            # The service that reads the text of a PDF, for the import of a resume (#267).
            - name: PDF_TEXT_URL
              value: "http://pdf-text"
            - name: APP_URL
              value: "https://fastresume.tech"
            - name: AI_GATEWAY_URL
              value: "http://ai-gateway"
            # The Content Security Policy (#205). First deploy: "report-only" (the browsers report what it
            # would block, to the logs, and block nothing). Look at `kubectl -n job-optimizer logs deploy/app
            # | grep "csp violation"` for a few days, then set "enforce" (or remove this variable: enforce
            # is the default). Setting it back to "report-only" is the way to undo a policy that breaks a page.
            - name: CSP_MODE
              value: "enforce"
          envFrom:
            - secretRef:
                name: app-secrets
          # Ready when the database answers; alive when the process answers
          # (restarting the app would not fix a database problem).
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
