apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: job-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-optimizer
  template:
    metadata:
      labels:
        app: job-optimizer
    spec:
      priorityClassName: workload-critical
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/quentinrebergue/job-application-optimizer:latest
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://app:$(POSTGRES_PASSWORD)@postgres:5432/job_optimizer"
            - name: RESUME_RENDERER_URL
              value: "http://resume-renderer"
            - name: APP_URL
              value: "https://fastresume.tech"
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
