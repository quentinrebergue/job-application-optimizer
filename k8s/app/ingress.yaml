apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: job-optimizer
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fastresume.tech
        - www.fastresume.tech
      secretName: app-tls
  rules:
    - host: fastresume.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
    - host: www.fastresume.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
