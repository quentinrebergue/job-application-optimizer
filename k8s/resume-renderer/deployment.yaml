apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-renderer
  namespace: job-optimizer
  annotations:
    # Second wave: Argo CD waits for the app (wave 0) to be healthy first, so the
    # two rollouts never run side by side on the single node (memory, see #171).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # Old ReplicaSets kept for a rollback (the default is 10, a long list in Argo CD).
  revisionHistoryLimit: 3
  # The old pod stops before the new one starts: no surge pod. PDF rendering
  # is down for a few seconds during a rollout, the site is not.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: resume-renderer
  template:
    metadata:
      labels:
        app: resume-renderer
    spec:
      priorityClassName: workload-critical
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resume-renderer
          # The tag is set by k8s/kustomization.yaml (CD writes it): this one does not exist on purpose.
          image: ghcr.io/quentinrebergue/resume-renderer:set-by-kustomize
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RENDER_TIMEOUT
              value: "15s"
            - name: MAX_CONCURRENT
              value: "4"
            - name: SHUTDOWN_DELAY
              value: "5s"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
