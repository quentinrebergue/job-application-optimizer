apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: job-optimizer
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  pg_dump -h postgres -U app -d job_optimizer | gzip > /backup/job_optimizer-$TIMESTAMP.sql.gz
                  ls -1t /backup/job_optimizer-*.sql.gz | tail -n +8 | xargs -r rm --
              volumeMounts:
                - name: pgbackup
                  mountPath: /backup
          volumes:
            - name: pgbackup
              persistentVolumeClaim:
                claimName: pgbackup
