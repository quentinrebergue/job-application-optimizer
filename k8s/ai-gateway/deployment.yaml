apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: job-optimizer
  annotations:
    # Second wave, like resume-renderer: never rolls out next to the app (#171).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      priorityClassName: workload-critical
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 55
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-gateway
          # The tag is set by k8s/kustomization.yaml (CD writes it): this one does not exist on purpose.
          image: ghcr.io/quentinrebergue/ai-gateway:set-by-kustomize
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: AI_TOKEN
            # Mistral AI's European API (#192). A dated model name on purpose: "latest" would change
            # without notice, and Mistral retires models (watch the date). Never a "labs-" model: those
            # are trained on whatever the privacy setting says.
            - name: AI_BASE_URL
              value: "https://api.mistral.ai/v1"
            - name: AI_MODEL
              value: "mistral-small-2603"
            # Mistral answers in about 3 s: tight limits bound the cost and the wait when something is wrong.
            - name: REQUEST_TIMEOUT
              value: "45s"
            - name: SHUTDOWN_DELAY
              value: "5s"
            - name: MAX_OUTPUT_TOKENS
              value: "2000"
            - name: ATTEMPT_TIMEOUT
              value: "30s"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
