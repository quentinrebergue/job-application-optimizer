apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- priorityclass.yaml
- app/deployment.yaml
- app/service.yaml
- app/ingress.yaml
- app/ingress-static.yaml
- app/ingress-import.yaml
- postgres/statefulset.yaml
- postgres/service.yaml
- postgres/backup-pvc.yaml
- postgres/backup-cronjob.yaml
- resume-renderer/deployment.yaml
- resume-renderer/service.yaml
- resume-renderer/networkpolicy.yaml
- ai-gateway/deployment.yaml
- ai-gateway/service.yaml
- ai-gateway/networkpolicy.yaml
- password-hasher/deployment.yaml
- password-hasher/service.yaml
- password-hasher/networkpolicy.yaml
- pdf-text/deployment.yaml
- pdf-text/service.yaml
- pdf-text/networkpolicy.yaml
- cert-manager/cluster-issuer.yaml
- argocd/application.yaml
- db-migrator/job.yaml

# The only lines the CD pipeline edits: one tag per image we build.
images:
- name: ghcr.io/quentinrebergue/ai-gateway
  newName: ghcr.io/quentinrebergue/ai-gateway
  newTag: e012589
- name: ghcr.io/quentinrebergue/db-migrator
  newName: ghcr.io/quentinrebergue/db-migrator
  newTag: e012589
- name: ghcr.io/quentinrebergue/job-application-optimizer
  newName: ghcr.io/quentinrebergue/job-application-optimizer
  newTag: e012589
- name: ghcr.io/quentinrebergue/password-hasher
  newName: ghcr.io/quentinrebergue/password-hasher
  newTag: e012589
- name: ghcr.io/quentinrebergue/pdf-text
  newName: ghcr.io/quentinrebergue/pdf-text
  newTag: e012589
- name: ghcr.io/quentinrebergue/resume-renderer
  newName: ghcr.io/quentinrebergue/resume-renderer
  newTag: e012589
