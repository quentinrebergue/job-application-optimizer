# The resumes of the visitors cross this service: only the app may call it, and it calls nobody.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdf-text
  namespace: job-optimizer
spec:
  podSelector:
    matchLabels:
      app: pdf-text
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: job-optimizer
      ports:
        - protocol: TCP
          port: 8080
  egress: []
