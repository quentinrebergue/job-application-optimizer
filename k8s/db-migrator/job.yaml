apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrator
  namespace: job-optimizer
  annotations:
    # Run before ArgoCD updates anything else. If this Job fails, the sync
    # stops and the previous version of the app keeps running.
    argocd.argoproj.io/hook: PreSync
    # A Job cannot be updated in place: delete the previous one first, and
    # clean up after a success. A failed Job stays around so we can read it.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: db-migrator
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrator
          image: ghcr.io/quentinrebergue/db-migrator:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://app:$(POSTGRES_PASSWORD)@postgres:5432/job_optimizer"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
