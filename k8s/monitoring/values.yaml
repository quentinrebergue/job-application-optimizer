alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    size: 1Gi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
